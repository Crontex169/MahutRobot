# LeRobot ACT (Action Chunking with Transformers) Eğitim Konfigürasyonu
training:
  policy_type: "act"
  dataset_repo_id: "local/mahut_kol_pick_cube"
  output_dir: "outputs/train_act"
  
  # Model Hiperparametreleri
  chunk_size: 50         # Eylem öngörü ufku (Action chunk size)
  n_action_steps: 50     # Yürütülecek eylem sayısı
  kl_weight: 10.0
  hidden_dim: 512
  dim_feedforward: 3200
  backbone: "resnet18"
  
  # Optimizasyon
  batch_size: 32
  lr: 1e-5
  lr_backbone: 1e-5
  weight_decay: 1e-4
  num_workers: 4
  steps: 50000
  
  # Log & Checkpoint
  save_freq: 5000
  log_freq: 100
  device: "cuda"
