# ACT (yapılandırılmış komut, dilsiz kıyas). Komut: 17 boyutlu one-hot `observation.environment_state`.
# Veri kümesi `scripts/make_act_dataset.py` ile kaynak kümeden TÜRETİLİR (kaynak değişmez).
policy: act
dataset: mahut_smoke_v1_act
repo_id: local/mahut_smoke_v1_act
episodes: null
gpu: L4
timeout_min: 30
max_retries: 2
steps: 300
batch_size: 16
save_freq: 100
log_freq: 20
num_workers: 4
seed: 1000
video_backend: pyav
wandb: false
rename_map: {}
policy_args:
  chunk_size: 50
  n_action_steps: 50
